<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Služby – Lumen Consulting</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Elegantné karty pre sekciu služieb */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f8fa;
      color: #222;
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(90deg, #532d7f, #5bbf89);
      color: white;
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    nav a {
      color: white;
      margin: 0 0.8rem;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    nav a:hover {
      opacity: 0.8;
    }

    .hero {
      text-align: center;
      padding: 4rem 2rem 2rem;
      background: linear-gradient(to right, rgba(83,45,127,0.1), rgba(91,191,137,0.1));
    }

    .hero h1 {
      font-size: 2.2rem;
      color: #532d7f;
      margin-bottom: 0.5rem;
    }

    .hero p {
      max-width: 600px;
      margin: 0 auto;
      color: #444;
      font-size: 1.05rem;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.8rem;
      padding: 3rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .service-card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      border-top: 4px solid transparent;
    }

    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      border-top: 4px solid #5bbf89;
    }

    .service-card h2 {
      font-size: 1.3rem;
      color: #532d7f;
      margin-bottom: 1rem;
    }

    .service-card ul {
      list-style: none;
      padding-left: 0;
    }
